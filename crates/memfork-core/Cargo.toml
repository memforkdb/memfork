[package]
name = "memfork-core"
description = "The engine behind MemFork: an embedded in-memory database for AI agent memory with Git semantics — fork, merge, discard, rewind."
keywords = ["database", "in-memory", "agent", "branching", "persistent"]
categories = ["data-structures", "database-implementations"]
readme = "README.md"
documentation = "https://docs.rs/memfork-core"
# Keep the package to what a consumer needs: the crate, its README and the
# licence. Not the golden-file fixtures, which are large and are a CI concern.
include = ["src/**/*.rs", "README.md", "../../LICENSE"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
blake3.workspace = true
bytes.workspace = true
parking_lot.workspace = true
rpds.workspace = true
smallvec.workspace = true
thiserror.workspace = true

[dev-dependencies]
cap = "0.1"
proptest = "1.11"
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
