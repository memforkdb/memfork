description = "Fix a bug: reproduce it, prove it with a failing test, fix the cause, check for its siblings"

# Fill in each empty `accept` once with a command that exits 0 when that task
# is done, such as your test command. An empty one is never run.

[[task]]
id = "reproduce"
title = "Reproduce the bug and record the exact steps"
detail = "Store the steps and what you saw as a fact, with the files involved as its sources."

[[task]]
id = "test"
title = "Write a test that fails because of the bug"
depends_on = ["reproduce"]

[[task]]
id = "fix"
title = "Fix the cause, not the symptom, so the new test passes"
depends_on = ["test"]
accept = ""

[[task]]
id = "siblings"
title = "Run the whole suite and look for the same mistake elsewhere"
depends_on = ["fix"]
accept = ""
