reads = [".github/copilot-instructions.md", "AGENTS.md", "CLAUDE.md"]
docs = "https://code.visualstudio.com/docs/agent-customization/custom-instructions"
verified = "2026-09-22"

[[client]]
id = "factory-droid"
display = "Factory Droid"
docs = "https://docs.factory.ai/cli/configuration/mcp"
verified = "2026-09-22"
detect_dir = "$HOME/.factory"
# Read out of the shipped build (`@factory/cli-win32-x64`, `bin/droid.exe`):
# user servers are connected as `factory-cli`.
mcp_names = ["factory-cli"]
unverified = "`droid mcp add` takes the command and its arguments as one quoted string, so MemFork writes the file rather than guess at the quoting"

[client.file]
format = "json"
server_map = ["mcpServers"]
stdio_type = "stdio"
http_url_key = "url"
user = "$HOME/.factory/mcp.json"
project = ".factory/mcp.json"

[client.instructions]
reads = ["AGENTS.md", "CLAUDE.md"]
docs = "https://docs.factory.ai/cli/configuration/agents-md"
verified = "2026-09-22"

[[client]]
id = "openhands"
display = "OpenHands"
docs = "https://docs.openhands.dev/openhands/usage/cli/mcp-servers"
verified = "2026-09-22"
detect_dir = "$HOME/.openhands"
# No `mcp_names`: it sends the Python SDK's default, `mcp`, which names
# nothing in particular and would mislabel every other client built on it.
unverified = "the name it sends in MCP initialize is the SDK's default `mcp`, so its writes cannot be told from another such client's; on Windows it runs under WSL only, so its paths are WSL paths"

[client.cli]
binary = "openhands"
# `--transport` is required; the command is positional and its arguments
# follow `--`.
add = ["mcp", "add", "{name}", "--transport", "stdio", "{command}", "--", "{args}"]
status = ["mcp", "get", "{name}"]
remove = ["mcp", "remove", "{name}"]
# One file, no scope.
scope_user = []

[client.file]
format = "json"
server_map = ["mcpServers"]
http_url_key = "url"
user = "$HOME/.openhands/mcp.json"
# No project file: it reads one file, in the home directory.

[client.instructions]
reads = ["AGENTS.md", "CLAUDE.md"]
docs = "https://docs.openhands.dev/sdk/guides/skill.md"
verified = "2026-09-22"
