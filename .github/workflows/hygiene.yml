# Properties of the repository itself, kept true by a check rather than by
# remembering: no unfilled placeholders or stray tooling files, no internal
# schedule language in comments and documentation, and no emoji in Markdown.
#
# The patterns below are assembled from pieces at runtime. A check that greps
# for a literal string would match its own source, fail on itself, and teach
# everyone to ignore it.

name: Hygiene

on:
  push:
    branches: [main]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  placeholders:
    name: no placeholders or stray tooling files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: No unfilled placeholders or stray tooling files
        shell: bash
        run: |
          set -uo pipefail

          # Assembled, never written out: see the note at the top.
          assistant_file="CLAUDE$(printf '\056')md"
          kickoff="KICKOFF""_PROMPT"
          trailer="Co-Authored""-By"
          # A template's placeholder contact: a document whose contact is a
          # fill-in looks finished and is not.
          placeholder="YOUR_""PUBLIC_EMAIL"

          failed=0
          for pattern in "$assistant_file" "$kickoff" "$trailer" "$placeholder"; do
            # This workflow is the one file allowed to contain the pieces.
            if git grep -n -I -F -- "$pattern" -- . ":!.github/workflows/hygiene.yml"; then
              echo "::error::tracked files mention '$pattern'; see CONTRIBUTING.md"
              failed=1
            fi
          done

          if [ -e "$assistant_file" ] || [ -e "$kickoff.txt" ]; then
            echo "::error::$assistant_file or $kickoff.txt is present in the checkout"
            failed=1
          fi

          exit "$failed"

  no-schedule:
    name: no internal schedule language
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Comments and docs describe what the code does, not when it was built
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import subprocess
          import sys

          # A comment should say what the code does, not when it was written.
          # rustdoc publishes doc comments to docs.rs for good, so one tied to
          # a stage of development outlives both the stage and the sentence
          # being true.
          PATTERNS = [
              (re.compile(r"\bphase\s+\d", re.I), "a build phase"),
              (re.compile(r"\bacceptance test\s+[a-e]\d", re.I), "an acceptance-test id"),
          ]

          # The revision record is a history: it is allowed to say what was
          # decided when, and to name the tests a revision added. Everything
          # before it in that file is held to the same rule as the code.
          REVISION_HEADING = "## 11. Revisions"

          files = subprocess.run(
              ["git", "ls-files"], capture_output=True, text=True, check=True,
          ).stdout.split()

          found = False
          for path in files:
              if path == ".github/workflows/hygiene.yml":
                  continue  # the one file allowed to name the patterns
              try:
                  with open(path, encoding="utf-8") as handle:
                      lines = handle.readlines()
              except (UnicodeDecodeError, IsADirectoryError):
                  continue  # binary, or not a file we can read as text

              stop = len(lines)
              if path == "docs/DESIGN.md":
                  for number, line in enumerate(lines):
                      if line.startswith(REVISION_HEADING):
                          stop = number
                          break

              for number, line in enumerate(lines[:stop], 1):
                  for pattern, what in PATTERNS:
                      hit = pattern.search(line)
                      if hit:
                          found = True
                          print(
                              f"::error file={path},line={number}::"
                              f"{what} ({hit.group().strip()}) — say what the code "
                              f"does or guarantees instead; a DESIGN.md section "
                              f"reference is fine"
                          )

          sys.exit(1 if found else 0)
          PY

  no-emoji:
    name: no emoji in documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Tracked Markdown uses icons and words, not emoji
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import subprocess
          import sys

          # Pictographs, dingbats, flags, and the variation selector that turns
          # a symbol into an emoji. Deliberately *not* punctuation: an arrow,
          # an em dash and a section sign are typography, and they render the
          # same everywhere.
          EMOJI = re.compile(
              "["
              "\U0001F000-\U0001FAFF"  # pictographs, symbols, flags
              "\U00002B00-\U00002BFF"  # misc symbols and arrows block
              "\U0001F1E6-\U0001F1FF"  # regional indicators
              "\U0000FE0F"             # variation selector-16
              "\U000024C2\U00003030\U0000303D\U00003297\U00003299"
              "\U000000A9\U000000AE"   # (c) and (R), which render as emoji
              "]"
          )

          files = subprocess.run(
              ["git", "ls-files", "*.md", "*.markdown"],
              capture_output=True, text=True, check=True,
          ).stdout.split()

          found = False
          for path in files:
              with open(path, encoding="utf-8") as handle:
                  for number, line in enumerate(handle, 1):
                      for hit in EMOJI.finditer(line):
                          found = True
                          print(
                              f"::error file={path},line={number}::"
                              f"emoji U+{ord(hit.group()):04X} — use an icon from "
                              f"docs/assets/icons or plain words"
                          )

          sys.exit(1 if found else 0)
          PY
